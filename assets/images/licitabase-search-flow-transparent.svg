<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de busca de licitações</title>
  <desc id="desc">Busca de licitações conectada aos filtros palavra-chave, categoria, localização, órgão público e prazo.</desc>

  <defs>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16dc6b" stop-opacity="0.82" />
      <stop offset="0.55" stop-color="#07b852" stop-opacity="0.7" />
      <stop offset="1" stop-color="#056b35" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172029" stop-opacity="0.44" />
      <stop offset="0.5" stop-color="#0a1117" stop-opacity="0.34" />
      <stop offset="1" stop-color="#04090c" stop-opacity="0.26" />
    </linearGradient>
    <linearGradient id="glass-sheen" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0.018" />
      <stop offset="0.7" stop-color="#07b852" stop-opacity="0.03" />
      <stop offset="1" stop-color="#07b852" stop-opacity="0.055" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feFlood flood-color="#07b852" flood-opacity="0.22" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <filter id="frost-blur" x="-45%" y="-80%" width="190%" height="260%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <g filter="url(#frost-blur)" opacity="0.42" aria-hidden="true">
    <ellipse cx="460" cy="74" rx="190" ry="46" fill="#16dc6b" fill-opacity="0.22" />
    <ellipse cx="180" cy="192" rx="130" ry="43" fill="#07b852" fill-opacity="0.05" />
    <ellipse cx="698" cy="270" rx="150" ry="50" fill="#07b852" fill-opacity="0.05" />
    <ellipse cx="374" cy="432" rx="230" ry="54" fill="#07b852" fill-opacity="0.04" />
  </g>

  <g fill="none" stroke="#4fa876" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 10" opacity="0.3">
    <path d="M170 172V108c0-20 16-36 36-36h84" />
    <path d="M630 72h84c20 0 36 16 36 36v64" />
    <path d="M750 220c-38 31-78 58-119 87-72 52-135 102-211 136-57 26-101 48-142 76" />
  </g>

  <g filter="url(#glow)">
    <rect x="290" y="28" width="340" height="88" rx="44" fill="url(#primary)" stroke="#6ff0a6" stroke-opacity="0.82" stroke-width="1.7" />
    <rect x="292" y="30" width="336" height="84" rx="42" fill="url(#glass-sheen)" stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.7" />
    <circle cx="344" cy="72" r="28" fill="#063f29" fill-opacity="0.58" stroke="#ffffff" stroke-opacity="0.12" />
    <g transform="translate(327 55)" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
      <circle cx="14" cy="14" r="11" />
      <path d="m22 22 10 10" />
    </g>
    <text x="386" y="81" fill="#ffffff" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.25">Buscar licitações</text>
  </g>

  <g transform="rotate(-5 160 190)" filter="url(#shadow)">
    <rect x="24" y="154" width="272" height="72" rx="36" fill="url(#chip)" stroke="#6b9e81" stroke-opacity="0.32" stroke-width="0.9" />
    <rect x="26" y="156" width="268" height="68" rx="34" fill="url(#glass-sheen)" />
    <circle cx="62" cy="190" r="23" fill="#071916" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08" />
    <g transform="translate(50 178)" fill="none" stroke="#55b17b" stroke-width="3" stroke-linecap="round">
      <circle cx="9" cy="9" r="7" />
      <path d="m14 14 7 7" />
    </g>
    <text x="98" y="199" fill="#d8dddf" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Palavra-chave</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="678" y="154" width="218" height="72" rx="36" fill="url(#chip)" stroke="#6b9e81" stroke-opacity="0.32" stroke-width="0.9" />
    <rect x="680" y="156" width="214" height="68" rx="34" fill="url(#glass-sheen)" />
    <circle cx="718" cy="190" r="23" fill="#071916" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08" />
    <g transform="translate(706 178)" fill="none" stroke="#55b17b" stroke-width="3" stroke-linejoin="round">
      <path d="M2 10 11 1h11v11l-9 9L2 10Z" />
      <circle cx="17" cy="6" r="1.5" fill="#14db6a" stroke="none" />
    </g>
    <text x="752" y="199" fill="#d8dddf" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Categoria</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="544" y="260" width="284" height="72" rx="36" fill="url(#chip)" stroke="#6b9e81" stroke-opacity="0.32" stroke-width="0.9" />
    <rect x="546" y="262" width="280" height="68" rx="34" fill="url(#glass-sheen)" />
    <circle cx="584" cy="296" r="23" fill="#071916" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08" />
    <g transform="translate(573 282)" fill="none" stroke="#55b17b" stroke-width="3" stroke-linejoin="round">
      <path d="M11 27S2 18 2 10.5a9 9 0 1 1 18 0C20 18 11 27 11 27Z" />
      <circle cx="11" cy="10" r="3" />
    </g>
    <text x="620" y="305" fill="#d8dddf" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Localização</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="346" y="356" width="306" height="72" rx="36" fill="url(#chip)" stroke="#6b9e81" stroke-opacity="0.32" stroke-width="0.9" />
    <rect x="348" y="358" width="302" height="68" rx="34" fill="url(#glass-sheen)" />
    <circle cx="386" cy="392" r="23" fill="#071916" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08" />
    <g transform="translate(373 378)" fill="none" stroke="#55b17b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m2 9 11-7 11 7H2Z" />
      <path d="M5 11v11M11 11v11M17 11v11M23 11v11M2 25h24" />
    </g>
    <text x="422" y="401" fill="#d8dddf" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Órgão público</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="104" y="444" width="214" height="72" rx="36" fill="url(#chip)" stroke="#6b9e81" stroke-opacity="0.32" stroke-width="0.9" />
    <rect x="106" y="446" width="210" height="68" rx="34" fill="url(#glass-sheen)" />
    <circle cx="144" cy="480" r="23" fill="#071916" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08" />
    <g transform="translate(132 468)" fill="none" stroke="#55b17b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="4" width="22" height="19" rx="3" />
      <path d="M1 10h22M7 1v6M17 1v6" />
    </g>
    <text x="180" y="489" fill="#d8dddf" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Prazo</text>
  </g>
</svg>
