<svg data-theme-asset="light" xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
  <title id="title">Sistema orbital de portais do Licitabase</title>
  <desc id="desc">PNCP, BLL, BNC, PCP, Compras.gov e Licitanet orbitam o núcleo central do Licitabase.</desc>

  <style>
    .orbit-motion {
      transform-box: view-box;
      transform-origin: 380px 270px;
      will-change: transform;
    }

    .keep-upright {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }

    .orbit-inner, .orbit-middle, .orbit-outer { animation: orbit-clockwise 28s linear infinite; }
    .orbit-inner .keep-upright,
    .orbit-middle .keep-upright,
    .orbit-outer .keep-upright { animation: orbit-counterclockwise 28s linear infinite; }

    @keyframes orbit-clockwise {
      to { transform: rotate(360deg); }
    }

    @keyframes orbit-counterclockwise {
      to { transform: rotate(-360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .orbit-motion,
      .keep-upright {
        animation: none !important;
      }
    }
  </style>

  <defs>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#07b852" stop-opacity="0.18" />
      <stop offset="0.58" stop-color="#07b852" stop-opacity="0.05" />
      <stop offset="1" stop-color="#07b852" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="portal-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBF9" stop-opacity="0.98" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="hub-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7F4EB" stop-opacity="0.99" />
      <stop offset="1" stop-color="#F8FBF9" stop-opacity="0.99" />
    </linearGradient>
    <filter id="portal-shadow" x="-30%" y="-70%" width="160%" height="240%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#173A29" flood-opacity="0.42" />
    </filter>
    <filter id="core-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11" result="blur" />
      <feFlood flood-color="#07b852" flood-opacity="0.3" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="380" cy="270" r="266" fill="url(#ambient)" />

  <g fill="none" stroke="#07b852">
    <circle cx="380" cy="270" r="150" stroke-width="1.8" stroke-opacity="0.38" stroke-dasharray="3 8" />
    <circle cx="380" cy="270" r="178" stroke-width="1.5" stroke-opacity="0.27" stroke-dasharray="2 9" />
    <circle cx="380" cy="270" r="240" stroke-width="1.3" stroke-opacity="0.2" stroke-dasharray="2 10" />
  </g>

  <g class="orbit-motion orbit-inner">
    <g transform="translate(380 120)">
      <g class="keep-upright" filter="url(#portal-shadow)">
        <rect x="-64" y="-32" width="128" height="64" rx="32" fill="url(#portal-surface)" stroke="#12d663" stroke-opacity="0.78" stroke-width="1.7" />
        <text x="0" y="9" text-anchor="middle" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">PNCP</text>
      </g>
    </g>
    <g transform="translate(380 420)">
      <g class="keep-upright" filter="url(#portal-shadow)">
        <rect x="-55" y="-31" width="110" height="62" rx="31" fill="url(#portal-surface)" stroke="#12d663" stroke-opacity="0.78" stroke-width="1.7" />
        <text x="0" y="9" text-anchor="middle" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">BLL</text>
      </g>
    </g>
  </g>

  <g class="orbit-motion orbit-middle">
    <g transform="translate(534 181)">
      <g class="keep-upright" filter="url(#portal-shadow)">
        <rect x="-60" y="-31" width="120" height="62" rx="31" fill="url(#portal-surface)" stroke="#12d663" stroke-opacity="0.74" stroke-width="1.7" />
        <text x="0" y="9" text-anchor="middle" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">BNC</text>
      </g>
    </g>
    <g transform="translate(226 359)">
      <g class="keep-upright" filter="url(#portal-shadow)">
        <rect x="-60" y="-31" width="120" height="62" rx="31" fill="url(#portal-surface)" stroke="#12d663" stroke-opacity="0.74" stroke-width="1.7" />
        <text x="0" y="9" text-anchor="middle" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">PCP</text>
      </g>
    </g>
  </g>

  <g class="orbit-motion orbit-outer">
    <g transform="translate(172 150)">
      <g class="keep-upright" filter="url(#portal-shadow)">
        <rect x="-107" y="-33" width="214" height="66" rx="33" fill="url(#portal-surface)" stroke="#12d663" stroke-opacity="0.7" stroke-width="1.7" />
        <text x="0" y="9" text-anchor="middle" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Compras.gov</text>
      </g>
    </g>
    <g transform="translate(588 390)">
      <g class="keep-upright" filter="url(#portal-shadow)">
        <rect x="-84" y="-32" width="168" height="64" rx="32" fill="url(#portal-surface)" stroke="#12d663" stroke-opacity="0.7" stroke-width="1.7" />
        <text x="0" y="9" text-anchor="middle" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Licitanet</text>
      </g>
    </g>
  </g>

  <g filter="url(#core-glow)">
    <circle cx="380" cy="270" r="88" fill="none" stroke="#07b852" stroke-opacity="0.2" stroke-width="1.5" />
    <circle cx="380" cy="270" r="76" fill="url(#hub-surface)" stroke="#17dc69" stroke-opacity="0.85" stroke-width="2.2" />
    <circle cx="380" cy="270" r="61" fill="#EEF6F1" stroke="#07b852" stroke-opacity="0.34" />
    <image href="data:image/png;base64," x="342" y="226" width="76" height="88" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>
