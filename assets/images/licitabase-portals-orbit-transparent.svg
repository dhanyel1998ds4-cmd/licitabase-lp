<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
  <title id="title">Portais conectados ao Licitabase</title>
  <desc id="desc">PNCP, Compras.gov, BLL, Licitanet, BNC e PCP orbitam o núcleo central do Licitabase.</desc>

  <defs>
    <radialGradient id="ambient" cx="50%" cy="52%" r="50%">
      <stop offset="0" stop-color="#07b852" stop-opacity="0.16" />
      <stop offset="0.55" stop-color="#07b852" stop-opacity="0.04" />
      <stop offset="1" stop-color="#07b852" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1119" stop-opacity="0.98" />
      <stop offset="1" stop-color="#050810" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2418" stop-opacity="0.98" />
      <stop offset="1" stop-color="#04100a" stop-opacity="0.98" />
    </linearGradient>
    <filter id="node-shadow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="hub-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feFlood flood-color="#07b852" flood-opacity="0.28" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="460" cy="270" rx="390" ry="255" fill="url(#ambient)" />

  <g fill="none" stroke="#07b852" stroke-linecap="round">
    <ellipse cx="460" cy="270" rx="136" ry="92" stroke-width="1.8" stroke-opacity="0.35" stroke-dasharray="3 8" />
    <ellipse cx="460" cy="270" rx="244" ry="164" stroke-width="1.5" stroke-opacity="0.24" stroke-dasharray="2 9" />
    <ellipse cx="460" cy="270" rx="352" ry="224" stroke-width="1.3" stroke-opacity="0.18" stroke-dasharray="2 10" />
  </g>

  <g fill="#07b852">
    <circle cx="460" cy="46" r="4" />
    <circle cx="760" cy="152" r="4" />
    <circle cx="792" cy="326" r="4" />
    <circle cx="652" cy="470" r="4" />
    <circle cx="268" cy="470" r="4" />
    <circle cx="128" cy="326" r="4" />
  </g>

  <g filter="url(#node-shadow)">
    <rect x="390" y="24" width="140" height="58" rx="29" fill="url(#node)" stroke="#07b852" stroke-opacity="0.62" stroke-width="1.5" />
    <circle cx="421" cy="53" r="11" fill="#07b852" fill-opacity="0.13" stroke="#16dc6b" stroke-width="1.5" />
    <circle cx="421" cy="53" r="3.5" fill="#16dc6b" />
    <text x="443" y="61" fill="#ffffff" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">PNCP</text>
  </g>

  <g filter="url(#node-shadow)">
    <rect x="678" y="94" width="202" height="62" rx="31" fill="url(#node)" stroke="#07b852" stroke-opacity="0.62" stroke-width="1.5" />
    <circle cx="712" cy="125" r="11" fill="#07b852" fill-opacity="0.13" stroke="#16dc6b" stroke-width="1.5" />
    <circle cx="712" cy="125" r="3.5" fill="#16dc6b" />
    <text x="736" y="133" fill="#ffffff" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Compras.gov</text>
  </g>

  <g filter="url(#node-shadow)">
    <rect x="704" y="270" width="170" height="62" rx="31" fill="url(#node)" stroke="#07b852" stroke-opacity="0.62" stroke-width="1.5" />
    <circle cx="738" cy="301" r="11" fill="#07b852" fill-opacity="0.13" stroke="#16dc6b" stroke-width="1.5" />
    <circle cx="738" cy="301" r="3.5" fill="#16dc6b" />
    <text x="762" y="309" fill="#ffffff" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Licitanet</text>
  </g>

  <g filter="url(#node-shadow)">
    <rect x="594" y="432" width="140" height="58" rx="29" fill="url(#node)" stroke="#07b852" stroke-opacity="0.62" stroke-width="1.5" />
    <circle cx="625" cy="461" r="11" fill="#07b852" fill-opacity="0.13" stroke="#16dc6b" stroke-width="1.5" />
    <circle cx="625" cy="461" r="3.5" fill="#16dc6b" />
    <text x="648" y="469" fill="#ffffff" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">PCP</text>
  </g>

  <g filter="url(#node-shadow)">
    <rect x="186" y="432" width="140" height="58" rx="29" fill="url(#node)" stroke="#07b852" stroke-opacity="0.62" stroke-width="1.5" />
    <circle cx="217" cy="461" r="11" fill="#07b852" fill-opacity="0.13" stroke="#16dc6b" stroke-width="1.5" />
    <circle cx="217" cy="461" r="3.5" fill="#16dc6b" />
    <text x="240" y="469" fill="#ffffff" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">BNC</text>
  </g>

  <g filter="url(#node-shadow)">
    <rect x="46" y="270" width="140" height="62" rx="31" fill="url(#node)" stroke="#07b852" stroke-opacity="0.62" stroke-width="1.5" />
    <circle cx="77" cy="301" r="11" fill="#07b852" fill-opacity="0.13" stroke="#16dc6b" stroke-width="1.5" />
    <circle cx="77" cy="301" r="3.5" fill="#16dc6b" />
    <text x="101" y="309" fill="#ffffff" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">BLL</text>
  </g>

  <g filter="url(#hub-glow)">
    <circle cx="460" cy="270" r="88" fill="none" stroke="#07b852" stroke-opacity="0.24" stroke-width="1.4" />
    <circle cx="460" cy="270" r="74" fill="url(#hub)" stroke="#14d965" stroke-opacity="0.78" stroke-width="2" />
    <circle cx="460" cy="270" r="58" fill="#06100b" stroke="#07b852" stroke-opacity="0.28" />
    <image href="data:image/png;base64," x="426" y="230" width="68" height="79" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>
