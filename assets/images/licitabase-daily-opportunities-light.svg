<svg data-theme-asset="light" xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Atualização diária de oportunidades</title>
  <desc id="desc">O perfil da empresa e os dados oficiais do PNCP geram diariamente uma seleção de oportunidades compatíveis.</desc>

  <defs>
    <linearGradient id="daily-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.46" />
      <stop offset="0.48" stop-color="#F1F6F3" stop-opacity="0.36" />
      <stop offset="1" stop-color="#F8FBF9" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="daily-hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DFF3E7" stop-opacity="0.82" />
      <stop offset="0.52" stop-color="#E5F4EA" stop-opacity="0.72" />
      <stop offset="1" stop-color="#EDF7F1" stop-opacity="0.62" />
    </linearGradient>
    <linearGradient id="daily-glass-sheen" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.085" />
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.018" />
      <stop offset="0.7" stop-color="#07b852" stop-opacity="0.035" />
      <stop offset="1" stop-color="#07b852" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="daily-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16dc6b" />
      <stop offset="1" stop-color="#07b852" />
    </linearGradient>
    <filter id="daily-shadow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#173A29" flood-opacity="0.22" />
    </filter>
    <filter id="daily-glow" x="-50%" y="-80%" width="200%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feFlood flood-color="#07b852" flood-opacity="0.25" />
      <feComposite in2="blur" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="daily-frost-blur" x="-45%" y="-80%" width="190%" height="260%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <g filter="url(#daily-frost-blur)" opacity="0.42" aria-hidden="true">
    <ellipse cx="168" cy="102" rx="116" ry="46" fill="#07b852" fill-opacity="0.04" />
    <ellipse cx="616" cy="102" rx="102" ry="42" fill="#16dc6b" fill-opacity="0.035" />
    <ellipse cx="380" cy="226" rx="170" ry="54" fill="#07b852" fill-opacity="0.2" />
    <ellipse cx="380" cy="405" rx="300" ry="68" fill="#07b852" fill-opacity="0.035" />
  </g>

  <g fill="none" stroke="#6C9880" stroke-width="1.55" stroke-linecap="round" stroke-dasharray="3 10" opacity="0.28">
    <path d="M316 100h34c23 0 40 18 40 41v39" />
    <path d="M500 100h-54c-30 0-56 20-56 50v30" />
    <path d="M380 284v26" />
  </g>

  <g filter="url(#daily-shadow)">
    <rect x="16" y="48" width="300" height="104" rx="30" fill="url(#daily-card)" stroke="#6C9880" stroke-opacity="0.28" stroke-width="0.9" />
    <rect x="18" y="50" width="296" height="100" rx="28" fill="url(#daily-glass-sheen)" />
    <circle cx="68" cy="100" r="28" fill="#F0F6F2" fill-opacity="0.82" stroke="#067A39" stroke-opacity="0.14" />
    <g transform="translate(53 84)" fill="none" stroke="#067A39" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13" cy="10" r="7" />
      <path d="M1 30c1-8 6-12 12-12s11 4 12 12" />
      <path d="m23 8 4 4 7-9" />
    </g>
    <text x="110" y="96" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="22" font-weight="650">Perfil da empresa</text>
    <text x="110" y="125" fill="#66736B" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="14">Setor · Região · Capacidade</text>
  </g>

  <g filter="url(#daily-shadow)">
    <rect x="500" y="48" width="244" height="104" rx="30" fill="url(#daily-card)" stroke="#6C9880" stroke-opacity="0.28" stroke-width="0.9" />
    <rect x="502" y="50" width="240" height="100" rx="28" fill="url(#daily-glass-sheen)" />
    <circle cx="548" cy="100" r="28" fill="#F0F6F2" fill-opacity="0.82" stroke="#067A39" stroke-opacity="0.14" />
    <g transform="translate(533 84)" fill="none" stroke="#067A39" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m2 12 13-9 13 9H2Z" />
      <path d="M6 15v12M12 15v12M18 15v12M24 15v12M2 30h27" />
    </g>
    <text x="590" y="96" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650">PNCP</text>
    <text x="590" y="125" fill="#66736B" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="15">Dados oficiais</text>
  </g>

  <g filter="url(#daily-glow)">
    <rect x="172" y="180" width="416" height="104" rx="34" fill="url(#daily-hub)" stroke="#16dc6b" stroke-opacity="0.76" stroke-width="1.2" />
    <rect x="174" y="182" width="412" height="100" rx="32" fill="url(#daily-glass-sheen)" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="0.6" />
    <circle cx="232" cy="232" r="31" fill="#E7F4EB" fill-opacity="0.76" stroke="#FFFFFF" stroke-opacity="0.11" />
    <g transform="translate(216 216)" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 11A13 13 0 0 0 6 7L2 11" />
      <path d="M2 3v8h8" />
      <path d="M4 21a13 13 0 0 0 22 4l4-4" />
      <path d="M30 29v-8h-8" />
    </g>
    <text x="282" y="226" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="23" font-weight="650">Atualização diária</text>
    <text x="282" y="255" fill="#067A39" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="500">Novos dados todos os dias</text>
  </g>

  <g filter="url(#daily-shadow)">
    <rect x="20" y="310" width="720" height="190" rx="32" fill="url(#daily-card)" stroke="#6C9880" stroke-opacity="0.24" stroke-width="0.85" />
    <rect x="22" y="312" width="716" height="186" rx="30" fill="url(#daily-glass-sheen)" />
    <circle cx="68" cy="350" r="20" fill="#07b852" fill-opacity="0.18" />
    <path d="m68 337 3 9 9 3-9 3-3 9-3-9-9-3 9-3 3-9Z" fill="#16dc6b" />
    <text x="98" y="357" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="20.5" font-weight="650">Seleção de oportunidades para você</text>
    <g>
      <rect x="574" y="329" width="148" height="42" rx="21" fill="#F3F8F5" fill-opacity="0.42" stroke="#6C9880" stroke-opacity="0.24" stroke-width="0.8" />
      <rect x="576" y="331" width="144" height="38" rx="19" fill="url(#daily-glass-sheen)" />
      <circle cx="596" cy="350" r="4" fill="#16dc6b" />
      <text x="612" y="355" fill="#6D8D7B" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">Atualizado hoje</text>
    </g>

    <g transform="translate(42 392)">
      <rect width="216" height="78" rx="21" fill="url(#daily-card)" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="0.7" />
      <rect x="1.5" y="1.5" width="213" height="75" rx="19.5" fill="url(#daily-glass-sheen)" />
      <circle cx="30" cy="28" r="14" fill="#07b852" fill-opacity="0.14" />
      <path d="m24 28 4 4 8-9" fill="none" stroke="#16dc6b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="56" y="29" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="650">Tecnologia</text>
      <text x="56" y="56" fill="#66736B" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="13">Setor compatível</text>
    </g>

    <g transform="translate(272 392)">
      <rect width="216" height="78" rx="21" fill="url(#daily-card)" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="0.7" />
      <rect x="1.5" y="1.5" width="213" height="75" rx="19.5" fill="url(#daily-glass-sheen)" />
      <circle cx="30" cy="28" r="14" fill="#07b852" fill-opacity="0.14" />
      <path d="M30 18c6 0 10 4 10 10 0 8-10 16-10 16s-10-8-10-16c0-6 4-10 10-10Z" fill="none" stroke="#16dc6b" stroke-width="2.2" /><circle cx="30" cy="28" r="3" fill="#16dc6b" />
      <text x="56" y="29" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="650">Sua região</text>
      <text x="56" y="56" fill="#66736B" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="13">Localização ideal</text>
    </g>

    <g transform="translate(502 392)">
      <rect width="216" height="78" rx="21" fill="url(#daily-card)" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="0.7" />
      <rect x="1.5" y="1.5" width="213" height="75" rx="19.5" fill="url(#daily-glass-sheen)" />
      <circle cx="30" cy="28" r="14" fill="#07b852" fill-opacity="0.14" />
      <path d="M20 34V23h20v11M24 23v-5h12v5M18 35h24" fill="none" stroke="#16dc6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="56" y="29" fill="#102018" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="16.5" font-weight="650">Capacidade</text>
      <text x="56" y="56" fill="#66736B" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="13">Atendimento ideal</text>
    </g>
  </g>
</svg>
